<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="이번 달의 플레이리스트와 우리가 남긴 감상집.">
  <title>고통받은 시인들의 부서 — 월간 선곡 모임</title>
  <link rel="stylesheet" href="./assets/css/site.css">
</head>
<body>
  <!-- 상단 로고·문구는 이 파일에서 직접 수정 -->
  <header class="reader-header">
    <a class="wordmark" href="./">고통받은 시인들의 부서</a>
    <div class="header-right"><span class="header-note">두 곡의 취향, 오래 남는 감상.</span><a class="textlink admin-link" href="./admin/">관리자 화면 ↗</a></div>
  </header>
  <main class="reader-main">
    <div class="page-intro"><span class="eyebrow">OUR MONTHLY LISTENING ROOM</span><span class="issue" id="issue">MONTHLY ARCHIVE</span></div>
    <div id="loading" class="loading" role="status">우리의 음악을 꺼내오는 중…</div>
    <div id="content" hidden>
      <!-- 01. 이번 달 플리 -->
      <div class="reader-grid">
        <section class="current-panel" aria-labelledby="current-heading">
          <div class="panel-heading"><h1 id="current-heading">이번 달의 플리</h1><span class="eyebrow">01 / LISTEN</span></div>
          <div class="listening-art" id="player"></div>
          <div class="current-copy"><div class="title-row"><h2 id="current-title"></h2><span class="demo-label" id="current-demo">예시 회차</span></div><p id="current-description"></p><div id="playlist-link"></div></div>
        </section>
        <!-- 02. 지난 감상집 -->
        <section class="latest-panel" aria-labelledby="last-heading">
          <div class="panel-heading"><h2 id="last-heading">지난 플리 감상평</h2><span class="eyebrow">02 / READ</span></div>
          <div id="latest"></div>
        </section>
      </div>
      <!-- 접수 기간: 사용자 입력 없이 현재 시간으로 노출 여부 계산 -->
      <section class="participate" aria-label="접수 일정">
        <div class="archive-title"><div><span class="eyebrow">PARTICIPATE</span><h2>이건 네 귀에 줄 축복...</h2></div><span class="muted">접수 기간에만 제출 링크가 열려요.</span></div>
        <div class="submission-grid" id="submissions"></div>
      </section>
      <section class="archive-section" id="archive">
        <div class="archive-title"><div><span class="eyebrow">THE ARCHIVE</span><h2>우리가 함께 들었던 달들</h2></div><span class="muted">플레이리스트와 감상집을 함께 보관합니다.</span></div>
        <div class="archive-grid" id="archive-list"></div>
      </section>
    </div>
  </main>
  <footer class="site-footer"><span class="footer-logo">고통받은 시인들의 부서</span><span>음악은 흘러가고, 우리의 감상은 남습니다.</span><a href="./admin/">관리자 화면 ↗</a></footer>
  <!-- 이미지 감상집 뷰어. 동작: assets/js/reader.js -->
  <dialog class="viewer" id="viewer">
    <div class="viewer-top"><div><span class="eyebrow" id="viewer-month"></span><h2 id="viewer-title"></h2></div><button class="icon-button" id="viewer-close" aria-label="감상집 닫기">✕</button></div>
    <div id="viewer-body"></div>
  </dialog>
  <script type="module" src="./assets/js/reader.js"></script>
</body>
</html>
